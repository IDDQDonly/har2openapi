[project]
name = "har2openapi"
version = "0.1.0"
description = "Convert HTTP Archive (HAR) files into OpenAPI 3.0 specifications."
authors = [
    {name = "IDDQDonly"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "pyyaml>=6.0.2,<7.0.0",
]

[dependency-groups]
dev = [
    "openapi-schema-validator>=0.9.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
]
